name: check
# GAME-10: одна команда якості на кожен PR — lint + typecheck + test + build + validate-content.
# Матриця: мінімальна підтримувана Node (engines) і поточна LTS — інакше мінімум ніколи не тестується.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24']
    name: check (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet -r scripts/requirements.txt
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  # GAME-14: e2e у справжньому браузері (спайк Phaser 4). Скриншот сцени — артефакт CI.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # один воркер (playwright.config.ts): ~30 хв замість ~18; з двома вже впритул до 20
    # GAME-85: браузер і системні бібліотеки — уже в офіційному образі. `playwright install --with-deps` тягнув apt
    # і з'їдав 10 хв із 20 ліміту job. Тег образу = версія @playwright/test у package.json (оновлювати разом).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Сторож розбіжності: якщо @playwright/test оновили, а образ ні, — браузера потрібної ревізії в образі немає.
      # Червоніємо тут із причиною, а не таймаутом у тестах (закон 4).
      - name: Браузер образу відповідає @playwright/test
        # Справжній запуск headless (той самий бінарник, що й у тестах — headless shell), а не перевірка шляху.
        run: >-
          node -e "require('playwright-core').chromium.launch().then(b => b.close())
          .then(() => console.log('OK: headless Chromium запускається'))
          .catch(e => { console.log('::error::Браузер образу не запускається — тег образу в check.yml не збігається з @playwright/test ' + require('@playwright/test/package.json').version + ': ' + e.message.split('\\n')[0]); process.exit(1); })"
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: test-results
          retention-days: 7
