name: check
# GAME-10: одна команда якості на кожен PR — lint + typecheck + test + build + validate-content.
# Назва job «check» — саме її вимагає ruleset гілки main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
