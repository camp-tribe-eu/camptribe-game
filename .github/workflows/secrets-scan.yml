name: secrets-scan
# Захист від витоку даних. Репозиторій приватний, але приватний ≠ безпечний:
# доступ розширюється, а історія git не стирається.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Шукати секрети у змінених файлах
        run: |
          set -euo pipefail
          PAT='(ghp_|github_pat_|sk-[A-Za-z0-9]{20}|AIza[0-9A-Za-z_-]{30}|BEGIN [A-Z ]*PRIVATE KEY|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}:[0-9a-f]{32}|PGPASSWORD=|159\.69\.[0-9]+\.[0-9]+)'
          if grep -rIniE "$PAT" --exclude-dir=.git --exclude=secrets-scan.yml . ; then
            echo "::error::Знайдено схоже на секрет. Прибери з коду І з історії git."
            exit 1
          fi
          echo "Збігів немає."

      - name: Негативний контроль — довести, що сканер уміє спрацювати
        run: |
          set -euo pipefail
          PAT='(ghp_|github_pat_|sk-[A-Za-z0-9]{20}|AIza[0-9A-Za-z_-]{30}|BEGIN [A-Z ]*PRIVATE KEY|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}:[0-9a-f]{32}|PGPASSWORD=|159\.69\.[0-9]+\.[0-9]+)'
          printf 'GH_TOKEN=ghp_AAAABBBBCCCCDDDDEEEEFFFFGGGGHHHH\n' > /tmp/bait.txt
          if grep -IniE "$PAT" /tmp/bait.txt >/dev/null; then
            echo "Сканер спрацював на підкинутому токені — перевірка не сліпа."
          else
            echo "::error::Сканер НЕ спрацював на явному секреті. Перевірка зламана."
            exit 1
          fi
