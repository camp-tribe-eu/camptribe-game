name: preview
# Закритий попередній перегляд гри для власника (рішення 23.10.2026): публічної версії немає. Збірка з main лежить на
# Cloudflare Pages як preview-гілка, а пускає на неї лише логін і пароль (варіант 2 власника, замість Cloudflare Access).
#
# Як закрито: Pages Functions middleware (scripts/preview/auth.mjs → functions/_middleware.js) перевіряє Basic-авторизацію
# НА СЕРВЕРІ — без пароля не віддається жоден файл збірки. У репозиторії пароля немає: CI кладе в функцію лише випадкову
# сіль і SHA-256 від «сіль:логін:пароль». Production-гілку (`release-never`) не публікуємо ніколи.
# Крок verify червоніє (закон 1), якщо: без пароля чи з хибним паролем видно гру; з правильним паролем гри НЕ видно
# (позитивний контроль — замок не просто «сайт лежить»); гола адреса проєкту віддає гру.
#
# Секрети (GitHub → Settings → Secrets → Actions): CLOUDFLARE_API_TOKEN (Pages: Edit), CLOUDFLARE_ACCOUNT_ID,
# PREVIEW_PASSWORD. Логін фіксований: camptribe.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview
  cancel-in-progress: false

env:
  PROJECT: camptribe-game
  BRANCH: preview
  WRANGLER: wrangler@4.145.0
  PREVIEW_USER: camptribe

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_PASSWORD: ${{ secrets.PREVIEW_PASSWORD }}
    steps:
      - name: Секрети задані
        run: |
          miss=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PREVIEW_PASSWORD; do [ -n "${!v:-}" ] || miss="$miss $v"; done
          [ -z "$miss" ] || { echo "::error::Не задано секрет(и):$miss — Settings → Secrets and variables → Actions"; exit 1; }
          echo "секрети є (значення не друкую)"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - name: Замок — тести без мережі
        run: node --test scripts/preview/auth.test.mjs

      - name: Замок — функція з сіллю й хешем (пароля в ній немає)
        run: |
          set -euo pipefail
          [ "${#PREVIEW_PASSWORD}" -ge 16 ] || { echo "::error::PREVIEW_PASSWORD коротший за 16 символів (рецензія PR #25: SHA-256 без повільного KDF)"; exit 1; }
          mkdir -p functions
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            import { randomBytes } from 'node:crypto';
            import { digest } from './scripts/preview/auth.mjs';
            const salt = randomBytes(16).toString('hex');
            const hash = await digest(salt, process.env.PREVIEW_USER, process.env.PREVIEW_PASSWORD);
            const src = readFileSync('scripts/preview/auth.mjs', 'utf8').replace('__PREVIEW_SALT__', salt).replace('__PREVIEW_HASH__', hash);
            if (src.includes('__PREVIEW_')) { console.log('::error::мітки не замінено'); process.exit(1); }
            writeFileSync('functions/_middleware.js', src);
          "
          ! grep -qF "$PREVIEW_PASSWORD" functions/_middleware.js || { echo "::error::пароль потрапив у функцію"; exit 1; }
          echo "функцію замка згенеровано"

      - name: Проєкт Pages (production-гілку не публікуємо ніколи)
        # Прямо через API, а не `out=$(wrangler …)`: крок іде під bash -e, і невдала підстановка обривала скрипт раніше,
        # ніж він друкував причину (run 39950520436 — «exit code 1» без жодного слова). Тепер друкуємо .errors Cloudflare.
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          r=$(curl -sS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$PROJECT" || true)
          if jq -e '.success' <<<"$r" >/dev/null 2>&1; then
            echo "проєкт є (production: $(jq -r '.result.production_branch' <<<"$r"))"
          else
            echo "проєкту немає або не прочитано: $(jq -c '.errors' <<<"$r" 2>/dev/null | head -c 400) — створюю"
            body=$(jq -cn --arg n "$PROJECT" '{name:$n, production_branch:"release-never"}')
            r=$(curl -sS --max-time 30 -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$api" --data "$body" || true)
            jq -e '.success' <<<"$r" >/dev/null 2>&1 || { echo "::error::Cloudflare не створив проєкт Pages: $(jq -c '.errors // .' <<<"$r" 2>/dev/null | head -c 600)"; exit 1; }
            echo "проєкт створено"
          fi

      - name: Публікація preview
        run: npx --yes "$WRANGLER" pages deploy dist --project-name="$PROJECT" --branch="$BRANCH" --commit-hash="$GITHUB_SHA" --commit-dirty=true

      - name: Перевірка замка (без пароля гри не видно, з паролем — видно)
        run: |
          set -uo pipefail
          url="https://$BRANCH.$PROJECT.pages.dev/"
          # «гра видна» = 200 і в HTML є <script src> зі збірки
          game() { local code; code=$(curl -s --max-time 20 -o /tmp/p.html -w '%{http_code}' "$@"); echo "$code"; [ "$code" = 200 ] && grep -q '<script[^>]*src=' /tmp/p.html; }
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            c1=$(game "$url"; true); c1=${c1%%$'\n'*}
            if game "$url" >/dev/null; then echo "::error::ГРА ВИДНА БЕЗ ПАРОЛЯ"; exit 1; fi
            if game -u "$PREVIEW_USER:wrong-password" "$url" >/dev/null; then echo "::error::ГРА ВИДНА З ХИБНИМ ПАРОЛЕМ"; exit 1; fi
            if game -u "$PREVIEW_USER:$PREVIEW_PASSWORD" "$url" >/dev/null; then ok=1; break; fi
            echo "спроба $i: з паролем гри ще не видно (без пароля: HTTP $c1), чекаю"; sleep 15
          done
          [ $ok = 1 ] || { echo "::error::з правильним паролем гра не відкривається — публікація не вдалася"; exit 1; }
          code=$(curl -s --max-time 20 -o /dev/null -w '%{http_code}' "$url"); [ "$code" = 401 ] || { echo "::error::без пароля очікував 401, а маю $code"; exit 1; }
          # Файли збірки теж за замком (рецензія PR #25): бандл беремо з HTML, отриманого з паролем, і просимо без пароля.
          curl -s --max-time 20 -u "$PREVIEW_USER:$PREVIEW_PASSWORD" -o /tmp/auth.html "$url"
          asset=$(grep -o '<script[^>]*src="[^"]*"' /tmp/auth.html | head -1 | sed 's/.*src="\([^"]*\)"/\1/; s#^\./##; s#^/##')
          [ -n "$asset" ] || { echo "::error::у HTML немає бандла — нема що перевіряти"; exit 1; }
          # Справжні файли збірки (бандл і перший не-JS файл із dist: мапа, шрифт, картинка) — лише 401.
          other=$(cd dist && find . -type f ! -name '*.html' ! -name '*.js' | sed 's#^\./##' | sort | awk 'NR==1')
          for path in "$asset" ${other:+"$other"}; do
            c=$(curl -s --max-time 20 -o /dev/null -w '%{http_code}' "https://$BRANCH.$PROJECT.pages.dev/$path")
            [ "$c" = 401 ] || { echo "::error::$path без пароля віддає HTTP $c (очікував 401)"; exit 1; }
            echo "$path без пароля → 401"
          done
          # Неіснуючий шлях: 401 або 404 (Cloudflare може віддати закешований 404, run 39958494211), але ніколи не 200.
          c=$(curl -s --max-time 20 -o /dev/null -w '%{http_code}' "https://$BRANCH.$PROJECT.pages.dev/favicon.ico")
          [ "$c" != 200 ] || { echo "::error::/favicon.ico без пароля віддає 200"; exit 1; }
          echo "/favicon.ico без пароля → $c"
          c=$(curl -s --max-time 20 -o /dev/null -w '%{http_code}' -u "$PREVIEW_USER:$PREVIEW_PASSWORD" "https://$BRANCH.$PROJECT.pages.dev/$asset")
          [ "$c" = 200 ] || { echo "::error::бандл з паролем: HTTP $c (очікував 200)"; exit 1; }
          if game "https://$PROJECT.pages.dev/" >/dev/null; then echo "::error::гола адреса проєкту віддає гру"; exit 1; fi
          echo "PREVIEW: OK · $url — логін $PREVIEW_USER і пароль із секрету PREVIEW_PASSWORD"

      - name: Старі публікації — видалити, крім щойно перевіреної (рецензія PR #25, #30)
        # Після verify, а не до публікації: інакше адреса порожніє, і Cloudflare кешує 404 (run 39958494211).
        # «Наша» — найновіша з commit_hash = GITHUB_SHA (deploy передає --commit-hash), а не просто найновіша:
        # ручна публікація поза workflow не стане «перевіреною». Колами, доки не лишиться тільки наша.
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments"
          ours=""
          for round in $(seq 1 20); do
            list=$(curl -sS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" || true)
            jq -e '.success' <<<"$list" >/dev/null 2>&1 || { echo "::error::перелік публікацій не отримано: $(jq -c '.errors' <<<"$list" 2>/dev/null | head -c 400)"; exit 1; }
            [ -n "$ours" ] || ours=$(jq -r --arg sha "$GITHUB_SHA" '[.result[] | select(.deployment_trigger.metadata.commit_hash == $sha)] | sort_by(.created_on) | last | .id // empty' <<<"$list")
            [ -n "$ours" ] || { echo "::error::серед публікацій немає тієї, що з коміту $GITHUB_SHA"; exit 1; }
            old=$(jq -r --arg id "$ours" '.result[] | select(.id != $id) | .id' <<<"$list")
            [ -n "$old" ] || { echo "лишилась одна публікація: $ours"; exit 0; }
            for id in $old; do
              curl -sS --max-time 30 -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$id?force=true" | jq -e '.success' >/dev/null \
                || { echo "::error::не вдалося видалити стару публікацію $id"; exit 1; }
              echo "видалено стару $id"
            done
          done
          echo "::error::після 20 кіл старі публікації ще лишились"; exit 1

      - name: Перевірка не пройшла — прибрати публікацію (рецензія PR #25)
        if: failure()
        run: |
          set -uo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments"
          for id in $(curl -sS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | jq -r '.result // [] | .[].id'); do
            curl -sS --max-time 30 -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$id?force=true" | jq -e '.success' >/dev/null \
              && echo "видалено $id" || echo "::error::НЕ ВИДАЛЕНО публікацію $id — прибрати вручну (Cloudflare → Pages → camptribe-game → Deployments)"
          done
