name: research-fetch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Музика
        run: |
          set -uo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) Chrome/130.0'
          mkdir -p out research/music-candidates
          n=0; : > research/music-candidates/meta.tsv
          while IFS=$'\t' read -r slot s; do
            [ -z "$s" ] && continue
            n=$(( $(grep -c "^$slot" research/music-candidates/meta.tsv || true) + 1 ))
            curl -sfL -A "$UA" "https://opengameart.org/content/$s" -o out/p.html || { echo "FAIL page $s"; continue; }
            python3 - out/p.html > out/m.txt <<'PY'
          import re,sys,html
          t=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          ti=re.search(r'<title>([^<|]+)',t); ti=html.unescape(ti.group(1)).strip() if ti else '?'
          i=t.find('License(s)'); blk=t[i:i+3000] if i>=0 else ''
          lic=' / '.join(dict.fromkeys(l.strip() for l in re.findall(r"""class=['"]license-name['"][^>]*>([^<]+)<""",blk))) or 'NOTFOUND'
          a=re.search(r'field-name-author-submitter.*?<a[^>]*>([^<]+)</a>',t,re.S); a=html.unescape(a.group(1)) if a else '?'
          fs=list(dict.fromkeys(re.findall(r'href="(https://opengameart\.org/sites/default/files/[^"]+\.(?:ogg|mp3|wav|flac))"',t)))
          pick=next((f for f in fs if 'loop' in f.lower()),fs[0] if fs else '')
          print(ti);print(a);print(lic);print(pick)
          PY
            title=$(sed -n 1p out/m.txt); auth=$(sed -n 2p out/m.txt); lic=$(sed -n 3p out/m.txt); f=$(sed -n 4p out/m.txt)
            [ -n "$f" ] || { echo "FAIL nofile $s"; continue; }
            curl -sfL -A "$UA" "$f" -o out/src || { echo "FAIL dl $s"; continue; }
            o="research/music-candidates/$slot-$n-$(echo "$s" | cut -c1-30 | sed 's/-$//').ogg"
            ffmpeg -nostdin -loglevel error -y -i out/src -vn -c:a libvorbis -b:a 96k "$o" || { echo "FAIL ffmpeg $s"; continue; }
            sz=$(stat -c %s "$o")
            if [ "$sz" -gt 1600000 ]; then ffmpeg -nostdin -loglevel error -y -i out/src -vn -ac 1 -c:a libvorbis -b:a 64k "$o"; sz=$(stat -c %s "$o"); fi
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$o")
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$slot" "$(basename $o)" "$title" "$auth" "https://opengameart.org/content/$s" "$lic" "$dur" "$sz" "$f" >> research/music-candidates/meta.tsv
            echo "ok $s $sz"
          done < research/music-search/picks.txt
          git config user.name research-bot; git config user.email noreply@anthropic.com
          git add research/music-candidates
          git commit -m "research: music candidates" && git push origin HEAD:${GITHUB_REF_NAME}
