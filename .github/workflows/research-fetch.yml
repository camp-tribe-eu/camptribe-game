name: research-fetch
# Мережа сесії чату Гри закрита для kenney.nl, opengameart.org, Steam, itch.io. Runner GitHub — ні.
# Цей workflow забирає матеріали з ПЕРШОДЖЕРЕЛ для огляду й проб.
# Запуск: зміна research/fetch.txt у пуші. Рядок файлу: `назва<TAB>джерело`
#   kenney:<slug>       — сторінка kenney.nl/assets/<slug>, zip першоджерела (CC0)
#   oga:<slug>          — сторінка opengameart.org/content/<slug>: ліцензія з цієї сторінки + усі файли з неї
#   ogasearch:<слова>   — лише список знайдених сторінок OGA (назва, посилання) у list.txt
#   url                 — будь-який файл як є
# 🔴 Комітиться в research/packs/<назва>/ ЛИШЕ те, у чого назва починається з `pack-`, і ЛИШЕ разом
#    із ліцензією, процитованою зі сторінки першоджерела. Чужі скриншоти ігор (steam:) не комітяться ніколи.
on:
  push:
    paths: ['research/fetch.txt', '.github/workflows/research-fetch.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Забрати
        run: |
          set -uo pipefail
          mkdir -p out
          fail=0
          while IFS=$'\t' read -r name src; do
            [ -z "${name:-}" ] && continue
            case "$name" in \#*) continue;; esac
            d="out/$name"; mkdir -p "$d"
            case "$src" in
              kenney:*)
                slug="${src#kenney:}"
                page=$(curl -sfL "https://kenney.nl/assets/$slug") || { echo "::error::$name: сторінка $slug недоступна"; fail=1; continue; }
                printf '%s' "$page" | grep -oiE 'Creative Commons[^<"]{0,40}' | head -3 > "$d/LICENSE-from-page.txt"
                zip=$(printf '%s' "$page" | grep -oE 'https://kenney\.nl/media/[^"]+\.zip' | head -1)
                [ -z "$zip" ] && { echo "::error::$name: zip не знайдено на сторінці"; fail=1; continue; }
                echo "$zip" > "$d/SOURCE.txt"
                curl -sfL "$zip" -o "$d/pack.zip" && unzip -q "$d/pack.zip" -d "$d/pack" && rm "$d/pack.zip"
                ;;
              oga:*)
                slug="${src#oga:}"
                url="https://opengameart.org/content/$slug"
                curl -sfL "$url" -o "$d/page.html" || { echo "::error::$name: $url недоступна"; fail=1; continue; }
                echo "$url" > "$d/SOURCE.txt"
                # Ліцензія — дослівно з блоку License(s) сторінки першоджерела.
                python3 - "$d/page.html" > "$d/LICENSE-from-page.txt" <<'PY'
          import re,sys,html
          t=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          i=t.find('License(s)')
          blk=t[i:i+4000] if i>=0 else ''
          open(sys.argv[1]+'.lic-snippet.txt','w').write(re.sub(r'<img[^>]*>','',blk[:1500]))
          urls=re.findall(r"""href=['"](https?://(?:[a-z.]*creativecommons\.org|www\.gnu\.org/licenses|opengameart\.org/content/oga-by)[^'"]*)['"]""",blk)
          names=re.findall(r"""class=['"]license-name['"][^>]*>([^<]+)<""",blk)
          lic=[f'{n.strip()} | {u}' for n,u in zip(names+['?']*len(urls),urls)]
          print('\n'.join(dict.fromkeys(lic)) or 'NOT FOUND')
          a=re.search(r'field-name-author-submitter.*?<a[^>]*>([^<]+)</a>',t,re.S)
          print('Submitted by:', html.unescape(a.group(1)) if a else 'NOT FOUND')
          for f in re.findall(r'href="(https://opengameart\.org/sites/default/files/[^"]+)"',t):
              print('FILE', f)
          PY
                grep '^FILE ' "$d/LICENSE-from-page.txt" | cut -d' ' -f2 | sort -u | head -12 | while read -r f; do
                  curl -sfL "$f" -o "$d/$(basename "$f")" || echo "::warning::$name: не скачано $f"
                done
                for z in "$d"/*.zip; do [ -f "$z" ] && unzip -q -o "$z" -d "$d/pack" && rm "$z"; done
                ;;
              ogasearch:*)
                q="${src#ogasearch:}"
                curl -sfL "https://opengameart.org/art-search-advanced?keys=$(printf '%s' "$q" | sed 's/ /+/g')&field_art_type_tid%5B%5D=9&sort_by=count&sort_order=DESC" -o "$d/search.html" || { fail=1; continue; }
                grep -oE 'href="/content/[^"]+"[^>]*>[^<]+' "$d/search.html" | sed -E 's#href="(/content/[^"]+)"[^>]*>#\1\t#' | sort -u | head -40 > "$d/list.txt"
                ;;
              steam:*)
                id="${src#steam:}"
                curl -sf "https://store.steampowered.com/api/appdetails?appids=$id&l=english" -o "$d/appdetails.json" || { echo "::error::$name: steam api"; fail=1; continue; }
                python3 - "$d" "$id" <<'PY'
          import json,sys,urllib.request
          d,i=sys.argv[1],sys.argv[2]
          j=json.load(open(f"{d}/appdetails.json"))[i]["data"]
          open(f"{d}/about.txt","w").write(j.get("short_description","")+"\n\n"+j.get("detailed_description",""))
          for n,s in enumerate(j.get("screenshots",[])[:8]):
              urllib.request.urlretrieve(s["path_full"],f"{d}/shot{n:02}.jpg")
          PY
                ;;
              *)
                curl -sfL "$src" -o "$d/$(basename "${src%%\?*}")" || { echo "::error::$name: $src"; fail=1; }
                ;;
            esac
            echo "$name: $(find "$d" -type f | wc -l) файлів"
          done < research/fetch.txt
          # Порожньо — не успіх (закон 4).
          [ "$(find out -type f | wc -l)" -gt 0 ] || { echo "::error::нічого не забрано"; exit 1; }
          exit $fail
      - name: Закомітити дозволене
        if: always()
        run: |
          set -euo pipefail
          for d in out/pack-* out/list-*; do
            [ -d "$d" ] || continue
            n=$(basename "$d")
            case "$n" in
              pack-*)
                # Без ліцензії, процитованої з першоджерела, не комітимо (aggregator-does-not-license).
                [ -s "$d/LICENSE-from-page.txt" ] && ! grep -q '^NOT FOUND' "$d/LICENSE-from-page.txt" || {
                  echo "::warning::$n: ліцензію не знайдено — не комічу"
                  # Лише фрагмент розмітки блоку ліцензії, щоб бачити причину (не арт).
                  mkdir -p research/debug; cp "$d/page.html.lic-snippet.txt" "research/debug/$n.txt" 2>/dev/null || true
                  continue; }
                mkdir -p "research/packs/$n"
                cp "$d/LICENSE-from-page.txt" "$d/SOURCE.txt" "research/packs/$n/"
                # Лише PNG і текстові ліцензії/титри, без zip і без звуку.
                # Kenney має 1700 окремих тайлів — беремо лише зведені аркуші.
                case "$n" in pack-kenney*) filt=( -ipath '*sheet*' -iname '*.png' -o -iname '*licen*' ) ;; *) filt=( -iname '*.png' -o -iname '*licen*' -o -iname '*credit*' -o -iname '*.txt' ) ;; esac
                (cd "$d" && find . -type f \( "${filt[@]}" \) -size -3M) | while read -r f; do
                  mkdir -p "research/packs/$n/$(dirname "$f")"; cp "$d/$f" "research/packs/$n/$f"
                done ;;
              list-*)
                mkdir -p research/lists; cp "$d/list.txt" "research/lists/$n.txt" ;;
            esac
          done
          git config user.name "research-bot"
          git config user.email "noreply@anthropic.com"
          # Лише наявні теки: git add із неіснуючим шляхом відкидає ВЕСЬ виклик (закон 4 — без || true).
          for t in research/packs research/lists research/debug; do if [ -d "$t" ]; then git add "$t"; fi; done
          echo "до коміту: $(git diff --staged --name-only | wc -l) файлів"
          git diff --staged --quiet || { git commit -m "research: набори з першоджерел для проби графіки"; git push origin HEAD:${GITHUB_REF_NAME}; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research
          path: out
          retention-days: 3
