name: research-fetch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Пошук
        run: |
          set -uo pipefail
          mkdir -p out research/music-search2
          UA='Mozilla/5.0 (X11; Linux x86_64) Chrome/130.0'
          : > out/hits.tsv
          while IFS= read -r q; do
            [ -z "$q" ] && continue
            enc=$(printf '%s' "$q" | sed 's/ /+/g')
            for p in 0 1; do
              curl -sfL -A "$UA" "https://opengameart.org/art-search-advanced?keys=$enc&field_art_type_tid%5B%5D=12&sort_by=count&sort_order=DESC&page=$p"
            done | grep -oE "href=\"/content/[^\"]+\"" | sed -E 's#href="/content/([^"]+)"#\1#' | sort -u | head -40 | sed "s/^/$q\t/" >> out/hits.tsv || true
          done < research/music-search2/queries.txt
          cut -f2 out/hits.tsv | sort -u > out/slugs.txt
          wc -l out/slugs.txt
          : > out/meta.tsv
          while read -r s; do
            curl -sfL -A "$UA" "https://opengameart.org/content/$s" -o out/p.html || continue
            python3 - "$s" out/p.html >> out/meta.tsv <<'PY'
          import re,sys,html
          s=sys.argv[1]; t=open(sys.argv[2],encoding='utf-8',errors='replace').read()
          ti=re.search(r'<title>([^<|]+)',t); ti=html.unescape(ti.group(1)).strip() if ti else '?'
          i=t.find('License(s)'); blk=t[i:i+3000] if i>=0 else ''
          lic=','.join(dict.fromkeys(re.findall(r"""class=['"]license-name['"][^>]*>([^<]+)<""",blk))) or 'NOTFOUND'
          a=re.search(r'field-name-author-submitter.*?<a[^>]*>([^<]+)</a>',t,re.S); a=html.unescape(a.group(1)) if a else '?'
          tags=','.join(re.findall(r"""rel=['"]tag['"][^>]*>([^<]+)<""",t))[:80]
          files=list(dict.fromkeys(re.findall(r'href="(https://opengameart\.org/sites/default/files/[^"]+\.(?:ogg|mp3|wav|flac))"',t)))
          fn=' | '.join(f.rsplit('/',1)[1] for f in files)[:600]
          print('\t'.join([s,ti,a,lic,tags,str(len(files)),fn]))
          PY
          done < out/slugs.txt
          sort -u out/hits.tsv > research/music-search2/hits.tsv
          cp out/meta.tsv research/music-search2/meta.tsv
          git config user.name research-bot; git config user.email noreply@anthropic.com
          git add research/music-search2
          git commit -m "research: music search 2" && git push origin HEAD:${GITHUB_REF_NAME}
