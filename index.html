<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>%GAME_NAME%</title>
    <!-- GAME-84 №11: значок вкладки — власний (намет), вбудований: файлу в public/ не треба (немає рядка реєстру ліцензій), і запиту, що дав би 404, теж. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%231b1f23'/%3E%3Cpath d='M8 2 1 13h14z' fill='%23d94f30'/%3E%3Cpath d='M8 7 5 13h6z' fill='%231b1f23'/%3E%3C/svg%3E" />
    <style>
      /* Піксельний шрифт із повною українською кирилицею (OFL, GAME-26; перевірка — scripts/i18n/font_glyphs.py). */
      @font-face { font-family: 'CampPixel'; src: url('fonts/PressStart2P-Regular.ttf') format('truetype'); font-display: swap; }
      /* Токени розмірів і відступів (GAME-92): жодних «магічних» чисел нижче. --safe-* — вирізи екрана (чубчик, жест «додому»);
         --edge-* = виріз + базовий відступ: так кнопки не липнуть до краю і не заходять під виріз. */
      :root {
        --gap: 16px;            /* базовий відступ від краю екрана */
        --gap-inline: 12px;     /* проміжок між ☰, текстом і ‖ (≥ 8) */
        --gap-header-bottom: 8px;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --edge-top: calc(var(--gap) + var(--safe-top));
        --edge-right: calc(var(--gap) + var(--safe-right));
        --edge-bottom: calc(var(--gap) + var(--safe-bottom));
        --edge-left: calc(var(--gap) + var(--safe-left));
        --header-btn: 48px;
        --stick-size: 128px;
        --knob-size: 56px;
        --action-size: 88px;
        --hud-lh: 1.4;
      }
      html, body { margin: 0; height: 100%; background: #1b1f23; color: #e8e6e3; font-family: system-ui, sans-serif; overscroll-behavior: none; }
      /* Розкладка (GAME-91): згори шапка (☰ ліворуч, текст HUD посередині, ‖ праворуч), під нею поле гри на весь решту екрана.
         Шапка в потоці, а не абсолютом: кнопки не наїжджають на текст, при тексті 200 % середня колонка переносить рядки. */
      #app { position: fixed; inset: 0; display: flex; flex-direction: column; touch-action: none; user-select: none; -webkit-user-select: none; }
      #ui { display: contents; }
      /* GAME-96: полотно покриває поле (кадр = ⌈поле / zoom⌉), зайве < zoom px з правого і нижнього краю ховаємо. */
      #stage { position: relative; flex: 1 1 0; min-height: 0; overflow: hidden; }
      /* Шапка (GAME-92): сітка ☰ | текст | ‖. Текст зліва, рядки на одній лівій межі, однаковий інтервал. */
      .ui-header { order: -1; flex: none; position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: start; column-gap: var(--gap-inline);
        box-sizing: border-box; padding: var(--edge-top) var(--edge-right) var(--gap-header-bottom) var(--edge-left); background: #1b1f23; }
      .ui-hud { position: relative; min-width: 0; min-height: var(--header-btn); display: flex; flex-direction: column; justify-content: flex-start; align-items: flex-start; text-align: left;
        /* Два рядки (місце, «день · гроші») стоять посередині висоти кнопки ☰; відступ зверху — той самий із підказкою й без: рядки не стрибають. */
        padding-top: max(0px, calc((var(--header-btn) - 2 * var(--hud-lh) * 0.8125rem) / 2)); box-sizing: border-box; color: #e8e6e3; font-size: 0.8125rem; line-height: var(--hud-lh); overflow-wrap: break-word; hyphens: auto; }
      .ui-hud [data-ui="hud-place"] { font-weight: 700; }
      /* Рядок 2: «День N, HH:MM · 50,00 €». GAME-84 №7: час і сума не розриваються всередині («EU R» при тексті 200 %), лише переносяться цілими. */
      .ui-hud-line { color: #cfcbc7; }
      .ui-hud [data-ui="hud-money"], .ui-hud [data-ui="hud-time"] { white-space: nowrap; }
      /* Рядок підказки — окремий, другорядний (менший, не жирний). Шапку видно лише тоді, коли жодна панель не відкрита, а підказка
         з'являється/зникає тільки всередині панелей (дія в «Подорожі», відкриття ☰/паузи), тож зникнення на очах не буває; рядок
         додається знизу, місце й «день · гроші» від нього не рухаються. Резерв рядка назавжди коштував би ~36 px поля при тексті 200 %. */
      .ui-hint { font-size: 0.75rem; color: #ffd54a; font-weight: 400; }
      /* GAME-95: підказка — тимчасовий тост: висить ПІД шапкою поверх поля, а не в потоці, тож коли зникає (≤ 5 с чи на першу дію),
         ні місце, ні годинник, ні кнопки, ні поле гри не зсуваються. Ліва й права межі — межі колонки HUD (GAME-92). */
      .ui-toast { position: absolute; left: 0; right: 0; top: 100%; z-index: 3; box-sizing: border-box; padding: 2px 6px 2px 0; font-size: 0.75rem; color: #ffd54a;
        background: #1b1f23d9; pointer-events: none; }
      .ui-story-btn[data-hint="yes"] { outline: 3px solid #ffd54a; outline-offset: 2px; }
      /* GAME-170 зріз 2: картка мети — другий ряд шапки на всю ширину (сторч). Числа однакової ширини: хвилини міняються щосекунди. */
      .ui-wave { grid-column: 1 / -1; display: flex; flex-wrap: wrap; column-gap: 10px; row-gap: 2px; align-items: baseline; margin-top: 4px; padding: 4px 8px; box-sizing: border-box;
        border-radius: 8px; background: #2a2f36; color: #e8e6e3; font-size: 0.8125rem; line-height: var(--hud-lh); font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
      .ui-wave-title { font-weight: 700; }
      .ui-wave-tasks { display: flex; flex-wrap: wrap; column-gap: 10px; min-width: 0; }
      .ui-wave-task { white-space: nowrap; color: #cfcbc7; }
      .ui-wave-task[data-outcome="done"] { color: #9be28f; }
      .ui-wave-task[data-outcome="late"] { color: #ffd54a; }
      /* GAME-175: рядок «Далі: …» / підпис дії біля об'єкта — сторч: накладка під шапкою на мапі, НЕ в потоці (інакше поле нижче на ряд і кадр мапи стрибає з zoom 2 на 1, game-91);  вбік — під ☰, як картка мети (вони БУВАЮТЬ разом — картка «збір удома» йде під час пакування: вбік рядок має свій третій ряд шапки, сторч він під усією шапкою). Не ловить дотик: карта під ним лишається тапабельною. */
      .ui-next { position: absolute; left: 8px; right: 8px; top: 100%; margin-top: 4px; z-index: 1; padding: 3px 8px; box-sizing: border-box; border-radius: 8px; background: #2a2f36; color: #ffd54a; font-size: 0.8125rem;
        line-height: var(--hud-lh); min-width: 0; overflow-wrap: anywhere; pointer-events: none; }
      .ui-next[data-kind="near"] { color: #9be28f; }
      /* GAME-180: трекер прохань — рядок усередині «Далі:»; повний пункт («Сміття 3/3») зеленіє: лишилось повернутись до просильника. */
      .ui-reqs { box-sizing: border-box; max-width: 100%; display: flex; flex-wrap: wrap; column-gap: 10px; padding: 3px 8px; border-radius: 8px; background: #2a2f36; color: #f4efe6; font-size: 0.8125rem; line-height: var(--hud-lh); font-weight: 700; font-variant-numeric: tabular-nums; pointer-events: none; }
      .ui-req-row[data-ready="yes"] { color: #9be28f; }
      /* Картка прохання в рамці розмови: що зробити, цілі-картинки, нагорода. */
      .ui-req-card { display: grid; gap: 4px; padding: 6px 8px; border-radius: 8px; background: #00000040; border: 1px solid #f1d9a066; }
      .ui-req-card p { margin: 0; overflow-wrap: anywhere; }
      .ui-req-title { font-size: 0.62rem; color: #f1d9a0; font-weight: 700; }
      .ui-req-goal { font-size: 0.72rem; line-height: 1.4; }
      .ui-req-goals { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
      .ui-req-goals li { display: flex; align-items: center; gap: 6px; padding: 2px 8px 2px 4px; border-radius: 8px; background: #ffffff1a; font-size: 0.7rem; }
      .ui-req-icon { width: 28px; height: 28px; image-rendering: pixelated; shape-rendering: crispEdges; flex: none; }
      .ui-req-reward { font-size: 0.62rem; line-height: 1.4; color: #9be28f; }
      /* GAME-181: смуга під шапкою (накладка на мапі, як .ui-next у GAME-175): ціль зверху, «Далі: …» під нею, між ними проміжок. Сторч — у стовпчик; вбік — рядки сітки шапки (див. @media нижче). */
      .ui-strip { position: absolute; left: 8px; right: 8px; top: 100%; margin-top: 4px; z-index: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; pointer-events: none; }
      .ui-strip .ui-next { position: static; margin-top: 0; }
      .ui-goal { box-sizing: border-box; max-width: 100%; padding: 3px 8px; border-radius: 8px; background: #2a2f36; color: #e8e6e3; font-size: 0.8125rem; line-height: var(--hud-lh); min-width: 0; overflow-wrap: anywhere; pointer-events: none; }
      .ui-goal[data-ended="yes"] { color: #9be28f; }
      /* GAME-181: банер нового звання — посередині поля, не ловить дотик, гасне сам. Рамка жовта (як цілі), текст світлий: контраст ≥ 4,5 на темному тлі. */
      .ui-titleup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 20; box-sizing: border-box; width: max-content; max-width: min(88vw, 520px); display: grid; gap: 4px; padding: 10px 14px;
        border: 2px solid #ffd54a; border-radius: 12px; background: #1b1f23f2; color: #e8e6e3; font-family: 'CampPixel', system-ui, sans-serif; font-size: 0.875rem; line-height: 1.5; text-align: center; overflow-wrap: anywhere; pointer-events: none; }
      .ui-titleup strong { color: #ffd54a; }
      /* GAME-181: смужки прогресу й блок навичок у ☰. */
      .ui-progress, .ui-skills { max-width: min(92vw, 640px); width: 100%; text-align: left; font-size: 0.75rem; }
      .ui-progress .ui-status { margin: 0 0 4px; }
      .ui-skills h3 { margin: 0 0 4px; font-size: 0.9rem; }
      .ui-skills ul { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px 16px; }
      .ui-skills li { display: grid; gap: 2px; align-content: start; }
      .ui-skill-next { color: #cfcbc7; }
      .ui-bar { height: 8px; border-radius: 4px; background: #2a2f35; border: 1px solid #e8e6e355; overflow: hidden; }
      .ui-bar > span { display: block; height: 100%; background: #6fa84f; }
      .ui-summary-reward { font-size: 0.9rem; color: #ffd54a; }
      .ui-btn-locked { border-style: dashed; color: #cfcbc7; background: #22262b; cursor: not-allowed; }
      #stage canvas { image-rendering: pixelated; }
      /* GAME-91: підпис збірки — у меню паузи (див. Shell.tsx), у діалозі він на своєму тлі. */
      .ui-build { margin: 0; font-size: 0.75rem; color: #e8e6e3; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
      /* GAME-84 №9: панель (#000000cc) напівпрозора — стрілки й кнопка дії під нею просвічували крізь текст. */
      #app:has([role="dialog"]) .touch { visibility: hidden; }
      .touch { position: absolute; inset: auto 0 0 0; height: 0; }
      /* Джойстик (знизу ліворуч) і кругла кнопка дії (знизу праворуч) лежать просто на мапі, напівпрозорі (GAME-91). */
      .touch-stick { position: absolute; left: var(--edge-left); bottom: var(--edge-bottom); width: var(--stick-size); height: var(--stick-size);
        box-sizing: border-box; border: 2px solid #e8e6e3aa; border-radius: 50%; background: #00000055; touch-action: none; }
      /* GAME-95: плаваюча основа. У спокої — бліда знизу ліворуч; під пальцем (data-active) — на повну яскравість, а left/bottom
         ставить touch.ts (центр під пальцем). Опації плавності немає: prefers-reduced-motion і так нічого не анімує. */
      .touch-stick:not([data-active]) { opacity: 0.4; }
      .touch-stick[data-active] { opacity: 1; }
      .touch-knob { position: absolute; left: 50%; top: 50%; width: var(--knob-size); height: var(--knob-size); margin: calc(var(--knob-size) / -2) 0 0 calc(var(--knob-size) / -2); border-radius: 50%;
        background: #e8e6e3aa; border: 2px solid #1b1f23aa; box-sizing: border-box; pointer-events: none; }
      .touch-interact { position: absolute; right: var(--edge-right); bottom: var(--edge-bottom); width: var(--action-size); height: var(--action-size);
        border: 2px solid #e8e6e3aa; border-radius: 50%; background: #00000066; color: #e8e6e3; font-size: 1.5rem; padding: 0; touch-action: none; }
      /* GAME-95: кнопка дії за ціллю. idle — бліда (натискається, нічого не робить); ready — яскрава, жовта рамка, значок цілі. */
      .touch-interact { display: flex; align-items: center; justify-content: center; }
      .touch-interact[data-state="idle"] { opacity: 0.45; }
      .touch-interact[data-state="ready"] { opacity: 1; border-color: #ffd54a; background: #000000bb; color: #ffd54a; }
      .touch-stick[hidden], .touch-interact[hidden] { display: none; }
      .ui-pause-btn, .ui-story-btn { flex: none; min-width: var(--header-btn); min-height: var(--header-btn); border-radius: 12px;
        border: 2px solid #e8e6e3aa; background: #00000066; color: #e8e6e3; font-size: 1.25rem; padding: 0; }
      /* safe center (GAME-39): діалог, вищий за екран (титри, текст 200 %), притискається до верху, а не
         вилазить за нього — інакше «Продовжити» лишалась вище за межу прокрутки. start — для браузерів без safe. */
      .ui-overlay { position: absolute; inset: 0; display: grid; place-content: start center; place-content: safe center; justify-items: center; gap: 12px; padding: 16px; font-family: 'CampPixel', system-ui, sans-serif; line-height: 1.6; overflow-wrap: anywhere; hyphens: auto;
        background: #000000cc; text-align: center; }
      .ui-story { place-content: start center; }
      .ui-story h3 { margin: 0 0 4px; font-size: 0.9rem; }
      .ui-quest, .ui-dialogue, .ui-mia { max-width: min(92vw, 640px); text-align: left; font-size: 0.75rem; }
      .ui-quest ul { margin: 0; padding-left: 0; list-style: none; }
      .ui-quest li[data-done="yes"] { opacity: 0.7; }
      .ui-dialogue { border: 1px solid #e8e6e355; border-radius: 8px; padding: 8px 12px; background: #2a2f35; }
      .ui-answers { display: grid; gap: 8px; }
      .ui-journal { max-width: min(92vw, 640px); font-size: 0.7rem; text-align: left; }
      .ui-journal summary { list-style: none; display: inline-block; cursor: pointer; }
      /* GAME-179: портрет (голова по плечі) і хто дав завдання / говорить — у панелі подорожі. Піксельні спрайти — без згладжування. */
      .ui-portrait { display: block; flex: none; image-rendering: pixelated; border: 2px solid #1b1f23; border-radius: 6px; background: #4a5a63; box-sizing: border-box; }
      .ui-portrait-icon { shape-rendering: crispEdges; }
      .ui-portrait-sm { width: 40px; height: 40px; }
      .ui-portrait-lg { width: 120px; height: 120px; }
      .ui-giver { display: flex; align-items: center; gap: 10px; margin: 0 0 6px; font-size: 0.75rem; color: #cfcbc7; text-align: left; }
      .ui-giver h3 { margin: 0; }
      /* GAME-179: рамка розмови внизу екрана (Stardew Valley / Eastward). Нижній край і боки — з урахуванням вирізів (--edge-*); мапа над рамкою лишається видно.
         Рамка — непрозора й ВИЩА за дотикові кнопки (джойстик, дія): під час розмови вони не потрібні, і дотик у них не влучає. */
      .ui-talk { position: absolute; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; pointer-events: none; box-sizing: border-box;
        padding: 0 var(--edge-right) var(--edge-bottom) var(--edge-left); font-family: 'CampPixel', system-ui, sans-serif; color: #f4f1e8; text-align: left; }
      .ui-talk-box { pointer-events: auto; position: relative; display: flex; align-items: flex-start; gap: 14px; width: min(100%, 780px); max-height: min(64%, 100%); box-sizing: border-box;
        padding: 22px 14px 14px; border: 3px solid #f1d9a0; border-radius: 10px; background: #2a2f35; box-shadow: 0 0 0 3px #1b1f23, 0 6px 0 3px #0009; cursor: pointer; }
      .ui-talk-box .ui-portrait-lg { box-shadow: 0 0 0 2px #f1d9a0; margin-top: 2px; }
      /* Табличка з іменем лежить на верхній рамці, праворуч від портрета — як у Stardew. */
      .ui-talk-name { position: absolute; top: -17px; left: 150px; margin: 0; max-width: calc(100% - 170px); padding: 4px 12px; border: 3px solid #1b1f23; border-radius: 6px; background: #ffd54a; color: #1b1f23;
        font-size: 0.8rem; line-height: 1.3; overflow-wrap: anywhere; }
      .ui-talk-main { flex: 1 1 0; min-width: 0; align-self: stretch; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; max-height: 100%; }
      .ui-talk-line { margin: 0; font-size: 0.8rem; line-height: 1.75; outline-offset: 4px; overflow-wrap: anywhere; }
      .ui-talk-line:focus { outline: none; }
      /* Ще не надруковане — на місці, але невидиме: рамка не стрибає, поки рядок дописується, а читач і тест бачать увесь текст. */
      .ui-ghost { opacity: 0; }
      .ui-talk-answers { display: grid; gap: 6px; justify-items: stretch; }
      .ui-talk-answers .ui-btn { text-align: left; min-height: 44px; padding: 6px 12px; max-width: 100%; font-size: 0.75rem; line-height: 1.5; }
      .ui-talk-answers .ui-btn[data-act="continue"] { justify-self: end; text-align: center; min-width: 120px; }
      .ui-talk-answers .ui-btn[data-act="continue"]::before { content: '\25BC  '; }
      .ui-talk-answers .ui-btn:focus-visible { outline: 3px solid #ffd54a; outline-offset: 2px; }
      /* Телефон вбік (844×390): рамка низька, портрет менший (80 = ×2 від обрізка 40 px), відповіді в два стовпці. */
      @media (max-height: 500px) {
        .ui-talk-box { gap: 10px; padding: 18px 10px 10px; max-height: 78%; }
        .ui-portrait-lg { width: 80px; height: 80px; }
        .ui-talk-name { left: 108px; max-width: calc(100% - 128px); font-size: 0.7rem; padding: 3px 10px; }
        .ui-talk-line { font-size: 0.72rem; line-height: 1.6; }
        .ui-talk-main { gap: 6px; }
        .ui-talk-answers { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
      }
      @media (min-width: 900px) and (min-height: 700px) { .ui-portrait-lg { width: 160px; height: 160px; } .ui-talk-name { left: 190px; } .ui-talk-line { font-size: 0.9rem; } }
      .ui-overlay h2 { margin: 0 0 8px; font-size: 1.5rem; }
      .ui-overlay fieldset { border: 1px solid #e8e6e355; border-radius: 8px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: min(92vw, 640px); }
      /* GAME-40: повзунки гучності — ціль дотику ≥ 44×44 (world.spec «кожна ціль … ≥ 44×44»). */
      .ui-overlay fieldset[data-ui="audio"] label { display: flex; align-items: center; gap: 8px; }
      .ui-overlay input[type="range"] { min-width: 160px; min-height: 48px; margin: 0; accent-color: #6fa84f; }
      /* line-height: кнопка не успадковує його (UA: normal) — у піксельного шрифту рядки підпису злипалися (відгук власника). */
